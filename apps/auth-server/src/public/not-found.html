<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #ffffff;
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand img {
            width: 40px;
            height: 40px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .error-info {
            font-size: 16px;
            line-height: 1.5;
        }

        .error-code {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .message {
            color: #70757a;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <img src="/logo.svg" alt="Aurik Logo">
            <span class="brand-name">Aurik</span>
        </div>
        
        <div class="error-info">
            <div class="error-code">404. <span style="font-weight: 400;">That’s an error.</span></div>
            <div class="message">
                The requested URL was not found on this server.
            </div>
        </div>
    </div>
</body>
</html>
